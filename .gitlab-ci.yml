stages:
  - lint
  - build
  - test
  - e2e
# Lint the client.
lint-client:
  stage: lint
  image: node:22
  script:
    - cd client
    - npm ci
    - npm run lint
# Build the client's production bundle.
build-client:
  stage: build
  image: node:22
  script:
    - cd client
    - npm ci
    - npm run build
# Lint the server. Runs in parallel with lint-client.
lint-server:
  stage: lint
  image: node:22
  script:
    - cd server
    - npm ci
    - npm run lint

# Compile the server. Fails if the TypeScript doesn't type-check.
build-server:
  stage: build
  image: node:22
  script:
    - cd server
    - npm ci
    - npm run build
test-server:
  stage: test
  image: node:22
  services:
    - name: postgres:16
  variables:
    POSTGRES_USER: app
    POSTGRES_PASSWORD: app_pw
    POSTGRES_DB: app_test_db
    PGHOST: postgres
    PGPORT: "5432"
    PGUSER: app
    PGPASSWORD: app_pw
    PGDATABASE: app_test_db
  script:
    - apt-get update && apt-get install -y postgresql-client
    - psql -h postgres -U app -d app_test_db -f db/init/001-schema.sql
    - cd server
    - npm ci
    - npm test
test-e2e:
  stage: e2e
  image: mcr.microsoft.com/playwright:v1.62.1-noble
  services:
    - name: postgres:16
  variables:
    POSTGRES_USER: app
    POSTGRES_PASSWORD: app_pw
    POSTGRES_DB: app_db
    PGHOST: postgres
    PGPORT: "5432"
    PGUSER: app
    PGPASSWORD: app_pw
    PGDATABASE: app_db
    E2E_BASE_URL: "http://localhost:4173"
  script:
    - apt-get update && apt-get install -y postgresql-client
    - psql -h postgres -U app -d app_db -f db/init/001-schema.sql
    - cd server && npm ci
    - npm run start:ci &
    - cd ../client && npm ci
    - npm run build
    - npx vite preview --port 4173 --host &
    - sleep 5
    - npx playwright test
